# Run configuration for the TabICL benchmark.
#   benchopt run . --config config_run.yml
# CLI flag names become top-level keys; `dataset`/`solver` take the same
# selectors as the CLI. List a component more than once to run a union of
# grids instead of one full cartesian product.
#
# WARNING: the full default grid is large (see the counts below). For a first
# pass, restrict with `-d`/`-s` filters, or comment out lines here.

# n-repetitions: 3
# max-runs and timeout only apply to iterative (convergence-curve) solvers;
# this benchmark uses sampling_strategy="run_once", so they are ignored.

# Required: objective_label must be set on every run (it raises if left None).
# Pass it via the CLI, e.g.
#   -o "TabICL inference[objective_label='baseline CPU run']"
# Recorded as `p_objective_objective_label` in the output parquet.
#
# Optional: scratch_dir is a shared scratch location for solvers that need
# disk space (e.g. offload_mode='disk'). Set it via the CLI, e.g.
#   -o "TabICL inference[objective_label='...',scratch_dir=/scratch/tabicl]"
# Solvers create a `disk-offload/` subdir inside it with per-run temp dirs.

# dataset:
  # n_train_samples and n_features are INDEPENDENT parameters, so the two
  # dataset-size axes can be swept separately (rows at fixed columns, and
  # vice-versa). List a dataset more than once to run a UNION of grids.
  # Classification also varies n_classes in {10, 100} and n_test_samples in
  # {1, 32, 512, 2048} (see datasets/simulated.py).
  #
  # WARNING: the full default cartesian product is large
  # (8 × 6 × 4 × 2 × 2 = 768 dataset instances). Always restrict with `-d`.
  #
  # Scaling grid (see run.sh): vary rows at fixed columns, and columns at fixed
  # rows, to isolate each axis's effect on time/memory:
  # - "Simulated[n_train_samples=[300,1000,2000,4000],n_features=50,task=classification,n_classes=10,n_test_samples=512]"
  # - "Simulated[n_train_samples=1000,n_features=[20,40,100,200],task=classification,n_classes=10,n_test_samples=512]"
  #
  # Size ladder (legacy, rows & columns coupled — kept for backward compat):
  # - "Simulated[n_train_samples=1000,n_features=20]"
  # - "Simulated[n_train_samples=5000,n_features=50]"
  # - "Simulated[n_train_samples=10000,n_features=100]"
  # - "Simulated[n_train_samples=50000,n_features=100]"
  # Restrict to one task with e.g.:
  # - "Simulated[task=classification]"
  # or one test-set size:
  # - "Simulated[n_test_samples=32]"

# solver:
  # Full solver grid: n_estimators x kv_cache x offload_mode = 4 x 2 x 4 = 32
  # configs per dataset. Override subsets from the CLI for faster iteration.
  # - TabICL-Classifier
  # - TabICL-Regressor
  # Example subsets:
  #   - "TabICL-Classifier[n_estimators=[1,8],kv_cache=False,offload_mode=auto]"
  #   - "TabICL-Regressor[device=cpu]"   # force CPU on a GPU machine

# Fix the random seed for reproducible splits:
# seed: 42
